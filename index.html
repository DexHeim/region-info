<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Region Info — транспорт и тюнинг, предметы, работы, игровые механики, недвижимость и карта Region.">
  <meta name="theme-color" content="#090a0b">
  <title>Region Info — справочник по игре Region</title>
  <link rel="icon" href="assets/img/region-info-icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/fonts.css">
  <link rel="stylesheet" href="assets/css/wiki.css?v=20261114-12">
  <link rel="stylesheet" href="assets/css/catalog.css?v=20261114-9">
  <link rel="stylesheet" href="assets/css/details.css?v=20261114-9">
</head>
<body>
  <a class="skip" href="#main">К содержанию</a>
  <aside class="sidebar" id="sidebar">
    <a class="brand" href="#/" aria-label="Region Info — главная">
      <img src="assets/img/region-info-icon.svg" width="42" height="42" alt="">
      <span><strong>REGION INFO</strong><small>Справочник игрока</small></span>
    </a>
    <button class="icon-button sidebar-close" id="menuClose" type="button" aria-label="Закрыть разделы"><svg class="icon" aria-hidden="true"><use href="assets/img/icons.svg#x"></use></svg></button>
    <nav id="navigation" aria-label="Разделы справочника"></nav>
    <div class="sidebar-footer">
      <a href="https://wiki.region.game/" target="_blank" rel="noreferrer">Источник · Region Wiki ↗</a>
      <span id="importDate">Загрузка базы…</span>
    </div>
  </aside>
  <button class="menu-backdrop" id="menuBackdrop" type="button" aria-label="Закрыть разделы" tabindex="-1"></button>
  <div class="workspace">
    <header class="topbar">
      <button class="icon-button menu-button" id="menuButton" aria-label="Открыть разделы" aria-expanded="false" aria-controls="sidebar"><svg class="icon" aria-hidden="true"><use href="assets/img/icons.svg#menu"></use></svg></button>
      <a class="mobile-brand" href="#/">REGION INFO</a>
      <button class="global-search" id="openSearch" type="button" aria-label="Поиск по всему справочнику" aria-haspopup="dialog" aria-controls="searchDialog" aria-expanded="false" disabled>
        <svg class="icon" aria-hidden="true"><use href="assets/img/icons.svg#search"></use></svg>
        <span>Машина, предмет, работа или место</span>
        <kbd>/</kbd>
      </button>
      <a class="topbar-tuning" href="#/tuning">Калькулятор тюнинга ↗</a>
    </header>
    <main id="main" tabindex="-1"><div class="loading" role="status">Загружаем справочник…</div></main>
    <footer class="footer">
      <span>Неофициальный справочник Region Info</span>
      <span><a href="https://github.com/DexHeim" target="_blank" rel="noreferrer">GitHub · @DexHeim</a> <a href="https://t.me/DexHeim" target="_blank" rel="noreferrer">Telegram</a></span>
    </footer>
  </div>
  <dialog id="searchDialog" class="search-dialog" aria-label="Поиск по справочнику">
    <form class="search-dialog-form" id="globalSearch" role="search">
      <svg class="icon" aria-hidden="true"><use href="assets/img/icons.svg#search"></use></svg>
      <label class="sr-only" for="globalQuery">Поиск по всему справочнику</label>
      <input id="globalQuery" type="search" role="combobox" aria-autocomplete="list" aria-controls="globalSearchOptions" aria-expanded="false" placeholder="Машина, предмет, работа или место" autocomplete="off" autofocus>
      <button class="search-dialog-clear icon-button" id="globalSearchClear" type="button" aria-label="Очистить поиск" hidden><svg class="icon" aria-hidden="true"><use href="assets/img/icons.svg#x"></use></svg></button>
      <button class="search-dialog-close" id="closeSearch" type="button" aria-label="Закрыть поиск"><kbd>Esc</kbd><svg class="icon" aria-hidden="true"><use href="assets/img/icons.svg#x"></use></svg></button>
    </form>
    <div class="search-suggestions" id="globalSuggestions"><div id="globalSearchOptions" role="listbox" aria-label="Разделы справочника"></div></div>
    <p class="sr-only" id="globalSearchStatus" role="status"></p>
    <div class="search-dialog-footer">
      <span class="search-key-hints"><span><kbd>↑</kbd><kbd>↓</kbd> выбрать</span><span><kbd>↵</kbd> открыть</span><span><kbd>Esc</kbd> закрыть</span></span>
      <button class="search-all" id="showAllSearch" type="submit" form="globalSearch">Открыть страницу поиска <svg class="icon" aria-hidden="true"><use href="assets/img/icons.svg#arrow-right"></use></svg></button>
    </div>
  </dialog>
  <aside id="compareTray" class="compare-tray" hidden aria-live="polite">
    <span id="compareCount"></span>
    <button id="compareClear" class="quiet-button" type="button">Очистить</button>
    <button id="compareOpen" class="primary-button" type="button">Сравнить</button>
  </aside>
  <dialog id="compareDialog" class="compare-dialog" aria-labelledby="compareTitle">
    <div class="dialog-head"><h2 id="compareTitle">Сравнение транспорта</h2><button class="icon-button" id="compareClose" aria-label="Закрыть сравнение"><svg class="icon" aria-hidden="true"><use href="assets/img/icons.svg#x"></use></svg></button></div>
    <div id="compareContent"></div>
  </dialog>
  <dialog id="imageDialog" class="image-dialog" aria-label="Просмотр изображения">
    <button id="imageDialogClose" class="icon-button" aria-label="Закрыть изображение"><svg class="icon" aria-hidden="true"><use href="assets/img/icons.svg#x"></use></svg></button>
    <img id="expandedImage" alt="">
    <p id="expandedImageCaption"></p>
  </dialog>
  <div id="toast" class="toast" role="status" hidden></div>
  <noscript><p>Для поиска, каталогов и карты включите JavaScript. <a href="https://wiki.region.game/">Открыть Region Wiki</a></p></noscript>
  <script src="assets/js/tuning.js?v=20260925-4"></script>
  <script src="assets/js/wiki.js?v=20261114-12" defer></script>
</body>
</html>
